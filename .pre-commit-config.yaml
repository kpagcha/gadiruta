# Reuse project tools from the lockfiles and pin standalone hook repositories below.
# Checks never rewrite files; run the documented format commands before staging fixes.
minimum_pre_commit_version: '4.6.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]
        stages: [pre-commit]
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: python-lint
        name: Python lint (Ruff)
        entry: uv run --locked ruff check .
        language: system
        files: '\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml|\.gitattributes)$'
        pass_filenames: false
      - id: python-format
        name: Python formatting (Ruff)
        entry: uv run --locked ruff format --check .
        language: system
        files: '\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml|\.gitattributes)$'
        pass_filenames: false
      - id: frontend-lint
        name: JavaScript and TypeScript lint (ESLint)
        entry: npm --prefix frontend run lint
        language: system
        files: '^frontend/|^(\.pre-commit-config\.yaml|\.gitattributes)$'
        pass_filenames: false
      - id: frontend-format
        name: Frontend formatting (Prettier)
        entry: npm --prefix frontend run format:check
        language: system
        files: '^frontend/|^(\.pre-commit-config\.yaml|\.gitattributes)$'
        pass_filenames: false
      - id: backend-tests
        name: Backend tests (pytest)
        entry: uv run --locked pytest
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: python-typecheck
        name: Python type checking (mypy)
        entry: uv run --locked mypy
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: django-check
        name: Django system checks
        entry: uv run --locked --env-file .env.example python manage.py check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: frontend-build
        name: Frontend type checking and build
        entry: npm --prefix frontend run build
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
