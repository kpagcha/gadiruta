[project]
name = "gadiruta"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "django-ninja>=1.7,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "scalar-ninja>=0.3,<0.4",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4.6,<5",
    "pytest>=8.3,<10",
    "pytest-django>=4.10,<5",
    "pytest-env>=1.1,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gadiruta.settings"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
required_plugins = ["pytest-django", "pytest-env"]

[tool.pytest_env]
# Test-only values, applied before pytest-django imports application settings.
DJANGO_SECRET_KEY = "gadiruta-test-only-key-not-for-deployment"
DJANGO_DEBUG = "false"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["gadiruta", "transport", "tests", "manage.py"]
ignore_missing_imports = true
check_untyped_defs = true
